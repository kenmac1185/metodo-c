<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b6f63"><title>CIPAC MT 53.3.1 AutoVision</title></head><body><h1>CIPAC MT 53.3.1 — AutoVision</h1><p>Versión web HTTPS para ensayo de humectación con una cámara.</p><video id="v" autoplay playsinline muted style="width:100%;max-width:900px;background:#111"></video><p><button id="b">Iniciar cámara</button></p><script>document.getElementById('b').addEventListener('click',async()=>{try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});document.getElementById('v').srcObject=s}catch(e){alert('No se pudo abrir la cámara: '+e.message)}});</script></body></html>
