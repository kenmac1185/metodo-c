<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b6f63"><link rel="stylesheet" href="./style.css"><title>CIPAC MT 53.3.1 AutoVision</title></head><body><header><div class="head"><div><div class="title">CIPAC MT 53.3.1 — AutoVision</div><div class="sub">Ensayo de humectación · una cámara</div></div><div class="status"><span class="dot"></span>Cámara</div></div></header><main><section class="card viewer"><video id="v" autoplay playsinline muted style="width:100%;border-radius:15px;background:#111"></video><div class="toolbar"><button id="b" class="primary">Iniciar cámara</button></div></section><aside class="card panel"><div class="timerBox"><div class="timer">0.00 <small>s</small></div><div class="state">En espera</div></div><h2>Identificación</h2><div class="grid"><div class="full"><label>Producto</label><input></div><div><label>Lote</label><input></div><div><label>Analista</label><input></div><div><label>Masa (g)</label><input value="5.00"></div><div><label>Agua (mL)</label><input value="100.0"></div></div></aside></main><script>document.getElementById('b').addEventListener('click',async()=>{try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});document.getElementById('v').srcObject=s}catch(e){alert('No se pudo abrir la cámara: '+e.message)}});</script></body></html>
